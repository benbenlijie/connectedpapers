name: Feature request
description: Suggest a capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This is an intentionally local-first, single-user tool, so features that need a
        hosted multi-user backend may not fit. Describing the underlying problem helps
        us find the right scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the current behaviour is not enough.
      placeholder: "Example: I want to keep a reading list across two machines, but notes and the reading queue only live in this browser's localStorage."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed behaviour
      description: What should the app do? UI changes, API routes, and config flags are all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, or examples.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
        - label: I am willing to help implement this (optional).
          required: false
