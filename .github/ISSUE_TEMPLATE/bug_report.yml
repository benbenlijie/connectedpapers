name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — a reproducible
        report is the fastest path to a fix.

        **Do not paste real secrets.** Redact `ACCESS_TOKEN`,
        `SEMANTIC_SCHOLAR_API_KEY`, `OPENALEX_API_KEY`, `INTERNAL_TOKEN`, and any
        `LLM_PROVIDERS` credentials. See [SECURITY.md](https://github.com/benbenlijie/connectedpapers/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour, including any error message.
      placeholder: "Example: clicking a node in the graph opens the details panel, but the citation count stays 0 even though the paper has citations on Semantic Scholar."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the behaviour you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers the bug. Include the search query, paper id/URL, or route if relevant.
      placeholder: |
        1. Start the server with `bun run server`
        2. Search for '...'
        3. Click '...'
        4. See the error
    validations:
      required: true

  - type: dropdown
    id: empty-db
    attributes:
      label: Does it reproduce with an empty data/app.db?
      description: |
        Stop the server, move `data/app.db` aside (for example to `data/app.db.bak`),
        start the server again, and retry. This separates first-run/data problems from
        cache or crawl problems.
      options:
        - "Yes, it still reproduces with an empty database"
        - "No, only with my existing data/app.db"
        - "Not tested"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and version.
      placeholder: "e.g. macOS 15.3, Ubuntu 24.04, Windows 11 + WSL2"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`.
      placeholder: "e.g. 1.3.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, if the bug is in the UI.
      placeholder: "e.g. Firefox 133, Chrome 131, Safari 18"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / version
      description: Output of `git rev-parse --short HEAD`, if you are running from source.
      placeholder: "e.g. 4b2fe128"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, console output, or screenshots
      description: Server logs and/or browser console output, with secrets redacted.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I have not included real API keys, tokens, or other secrets.
          required: true
